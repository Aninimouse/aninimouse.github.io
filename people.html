let activeTokenId = null;
const db = EXPORT_DATA;
let entitySortState = { field: '', asc: true };

function init() {
    renderTokenList();
    if(db.tokens.length > 0) selectToken(db.tokens[0].id);
}

function renderTokenList() {
    const col = document.createElement('div');
    col.className = 'col-tokens';
    const header = document.createElement('div');
    header.className = 'token-header';
    header.innerHTML = `Entities <span><span class='token-sort-btn' onclick='sortEntities(\"name\")'>Name ⬍</span> <span class='token-sort-btn' onclick='sortEntities(\"type\")'>Type ⬍</span></span>`;
    col.appendChild(header);

    db.tokens.forEach(t => {
        const item = document.createElement('div');
        item.className = 'token-item';
        item.id = 'token-tab-' + t.id;
        item.onclick = () => selectToken(t.id);
        item.innerHTML = `<div class='token-name'>${t.name}</div><div class='token-type'>${t.type}</div>`;
        col.appendChild(item);
    });
    document.getElementById('app-container').appendChild(col);

    const invCol = document.createElement('div');
    invCol.className = 'col-inventory';
    invCol.id = 'col-inventory';
    document.getElementById('app-container').appendChild(invCol);

    const insCol = document.createElement('div');
    insCol.className = 'col-inspect';
    insCol.id = 'col-inspect';
    document.getElementById('app-container').appendChild(insCol);
}

function sortEntities(field) {
    const container = document.querySelector('.col-tokens');
    const items = Array.from(container.querySelectorAll('.token-item'));
    if (items.length <= 1) return;

    if (entitySortState.field === field) {
        entitySortState.asc = !entitySortState.asc;
    } else {
        entitySortState.field = field;
        entitySortState.asc = true;
    }

    items.sort((a, b) => {
        const valA = a.querySelector(field === 'name' ? '.token-name' : '.token-type').innerText.trim();
        const valB = b.querySelector(field === 'name' ? '.token-name' : '.token-type').innerText.trim();
        return entitySortState.asc ? valA.localeCompare(valB) : valB.localeCompare(valA);
    });
    items.forEach(item => container.appendChild(item));
}

function sortTable(th, colIndex, isNumeric) {
    const table = th.closest('table');
    const tbody = table.querySelector('tbody') || table;
    const rows = Array.from(table.querySelectorAll('tr')).slice(1);
    if (rows.length <= 1) return;

    const isAsc = th.getAttribute('data-sort') !== 'asc';
    table.querySelectorAll('th').forEach(h => {
        h.removeAttribute('data-sort');
        h.innerText = h.innerText.replace(/ [▲▼]/, '');
    });

    th.setAttribute('data-sort', isAsc ? 'asc' : 'desc');
    th.innerText += isAsc ? ' ▲' : ' ▼';

    rows.sort((rowA, rowB) => {
        const cellA = rowA.children[colIndex].innerText.trim();
        const cellB = rowB.children[colIndex].innerText.trim();
        if (isNumeric) {
            const numA = parseFloat(cellA) || 0;
            const numB = parseFloat(cellB) || 0;
            return isAsc ? numA - numB : numB - numA;
        }
        return isAsc ? cellA.localeCompare(cellB) : cellB.localeCompare(cellA);
    });

    rows.forEach(row => tbody.appendChild(row));
}

function selectToken(tokenId) {
    document.querySelectorAll('.token-item').forEach(el => el.classList.remove('active'));
    const tab = document.getElementById('token-tab-' + tokenId);
    if(tab) tab.classList.add('active');
    activeTokenId = tokenId;

    const token = db.tokens.find(t => t.id === tokenId);
    renderInventory(token);
    document.getElementById('col-inspect').innerHTML = '<div style=\"color:#888; text-align:center; margin-top:40px;\"><i>Select an item to inspect its profile...</i></div>';
}

function renderInventory(token) {
    const col = document.getElementById('col-inventory');
    const data = token.inventoryData;
    const encMap = ['Unencumbered', 'Lightly Encumbered', 'Encumbered', 'Overencumbered'];
    const encColors = ['#2E8B57', '#DAA520', '#CD5C5C', '#8B0000'];
    const encState = data.encState || 0;

    let html = `
        <div class='header'>
            <table width='100%'><tr>
                <td><span style='font-size:15pt'>${token.name}</span></td>
                <td align='right'>Weight: <b>${data.currentWgt} / ${data.maxWgt}</b><br>
                <span style='color:${encColors[encState]}; font-size:11pt'>${encMap[encState]}</span></td>
            </tr></table>
        </div>
    `;

    data.containers.forEach(c => {
        let pct = c.maxVol > 0 ? Math.min(100, Math.floor((c.curVol / c.maxVol) * 100)) : 0;
        let barColor = c.curVol > c.maxVol ? '#8B0000' : '#4682B4';
        html += `
            <div class='container-box'>
                <div class='container-header'>
                    <div style='font-size:11pt;'>${c.label}</div>
                    <div style='font-size:10pt; font-weight:normal;'>Vol: ${c.curVol}/${c.maxVol}
                        <div class='vol-fill-container'><div class='vol-fill' style='width:${pct}%; background-color:${barColor}'></div></div>
                    </div>
                </div>
                ${renderItemList(c.contents)}
            </div>
        `;
    });

    const isVehicle = token.type.startsWith('Vehicle');
    if (data.heldItems && data.heldItems.length > 0) {
        html += `<div class='container-box'><div class='equipped-header'>${isVehicle ? 'Installed Weapons' : 'Held Items'}</div>${renderItemList(data.heldItems)}</div>`;
    }
    if (data.wornItems && data.wornItems.length > 0) {
        html += `<div class='container-box'><div class='equipped-header'>${isVehicle ? 'Fitted Upgrades' : 'Worn Items'}</div>${renderItemList(data.wornItems)}</div>`;
    }
    if (data.implantItems && data.implantItems.length > 0) {
        html += `<div class='container-box'><div class='equipped-header' style='background-color:#2e4e2e'>${isVehicle ? 'Integrated Systems' : 'Implants & Bionics'}</div>${renderItemList(data.implantItems)}</div>`;
    }

    col.innerHTML = html;
}

function renderItemList(items) {
    let html = `<table class='itemList'><tr>
        <th width='45%' onclick='sortTable(this, 0, false)'>Name</th>
        <th onclick='sortTable(this, 1, false)'>Type</th>
        <th onclick='sortTable(this, 2, true)'>Wgt</th>
        <th onclick='sortTable(this, 3, true)'>Vol</th>
        <th onclick='sortTable(this, 4, true)'>Qty</th>
    </tr>`;
    if (!items || items.length === 0) return html + `<tr><td colspan='5' style='text-align:center; color:#888;'><i>Empty</i></td></tr></table>`;

    items.forEach(item => {
        const topId = item.IDs[0];
        html += `<tr onclick=\"inspectItem('${topId}')\" id='inv-row-${topId}'>
            <td><b>${item.Name}</b></td>
            <td>${item.Type || ''}</td>
            <td>${(Number(item.Wgt) * Number(item.Qty)).toFixed(2)}</td>
            <td>${(Number(item.Vol) * Number(item.Qty)).toFixed(2)}</td>
            <td><span class='qty-badge center'>${item.Qty}</span></td>
        </tr>`;
    });
    return html + `</table>`;
}

function inspectItem(itemId) {
    document.querySelectorAll('.itemList tr').forEach(el => el.classList.remove('active'));
    const row = document.getElementById('inv-row-' + itemId);
    if(row) row.classList.add('active');

    const itemData = db.items[itemId];
    const col = document.getElementById('col-inspect');

    if (!itemData) {
        col.innerHTML = `<div style='color:red;'>Failed to load internal data for ID: ${itemId}</div>`;
        return;
    }

    const condDmg = Number(itemData.ConditionDamage || 0);
    const isDestroyed = itemData.Destroyed == 1;

    let html = `
        <div style='background-color: #333; color: white; padding: 8px; font-size: 12pt; font-weight: bold;'>
            ${itemData.Name || 'Unknown Item'}
            <div style='float:right; font-size: 10pt; font-weight: normal; color: #ccc;'>${itemData.Type || ''} (ID: ${itemId})</div>
        </div>
        <div style='background-color: #555; color: #ddd; padding: 4px 8px; font-size: 9pt;'>
            ${condDmg > 0 ? `<b style='color:#fbb'>Condition Damage: ${condDmg}</b> | ` : ''}
            ${isDestroyed ? `<b style='color:red'>[DESTROYED]</b> | ` : ''}
            <b>Weight:</b> ${itemData.Wgt || 0} kg | <b>Volume:</b> ${itemData.Vol || 0}
        </div>
        <div style='padding: 10px; background-color: #fff; border-bottom: 1px solid #ccc; font-style: italic; font-size: 11pt;'>
            ${itemData.Desc || 'No description available.'}
        </div>
    `;

    const isMag = ['Magazine', 'Clip', 'Ammo Belt', 'Ammo Backpack'].includes(itemData.Type);
    if (isMag && itemData.LoadedAmmo) {
        const loadCount = itemData.LoadedAmmo.length;
        let topRoundStr = `<span style='color:#888; font-style:italic'>Empty</span>`;
        if (loadCount > 0) {
            const topId = itemData.LoadedAmmo[loadCount - 1];
            topRoundStr = `<b>Top Round:</b> <span style='color:#000080; font-weight:bold;'>${db.items[topId] ? db.items[topId].Name : 'Unknown ('+topId+')'}</span>`;
        }
        html += `<div class='sub-header'>Ammunition (${loadCount} / ${itemData.Capacity || 0})</div>
                 <div style='padding:6px; background-color:#fff; border-bottom: 1px solid #ccc; font-size:10pt;'>${topRoundStr}</div>`;
    }

    if (itemData.Attacks && typeof itemData.Attacks === 'object') {
        html += `<div class='sub-header'>Weapon Profiles</div>`;
        for (const [atkName, atk] of Object.entries(itemData.Attacks)) {
            const d = atk.Damage || [];
            const dStr = d.length >= 4 ? `${d[0]}d${d[1]}+${d[2]} (${d[3]})` : '-';
            const r = atk.Range || [];
            let rStr = '-';
            if (r.length === 3) {
                const bRng = Number(r[0]), xRng = Number(r[1]), mRng = Number(r[2]);
                rStr = mRng > 0 ? `${bRng}m (Xtr: ${bRng*xRng}m / Max: ${mRng})` : `${bRng}m (Xtr: ${bRng*xRng}m)`;
            } else if (r.length >= 1) rStr = `${r[0]}m`;

            const pen = (Number(atk.Pen) || 0) + (Number(atk.Pen_Mod) || 0);
            let mStr = atk.Malfunction_Rate ? (Array.isArray(atk.Malfunction_Rate) ? atk.Malfunction_Rate.join('/') : atk.Malfunction_Rate) : '-';
            if (itemData.Malfunction_Types) mStr += ` (${Object.keys(itemData.Malfunction_Types).join(', ')})`;

            html += `
                <div class='attack-box'>
                    <div class='attack-header'>${atkName}</div>
                    <table class='stat-block'>
                        <tr>
                            <td width='33%'><span class='stat-label'>Dmg:</span> ${dStr}</td>
                            <td width='33%'><span class='stat-label'>Pen:</span> ${pen}</td>
                            <td width='33%'><span class='stat-label'>RoF:</span> ${atk.RoF ? (Array.isArray(atk.RoF) ? atk.RoF.join('/') : atk.RoF) : '-'}</td>
                        </tr>
                        <tr>
                            <td><span class='stat-label'>Rng:</span> ${rStr}</td>
                            <td><span class='stat-label'>Recoil:</span> ${atk.Recoil_Mod || '0'}</td>
                            <td><span class='stat-label'>Malf:</span> ${mStr}</td>
                        </tr>
                    </table>
            `;

            if (atk.Qualities && Object.keys(atk.Qualities).length > 0) {
                let qList = Object.entries(atk.Qualities).map(([k, v]) => `<span class='tag'>${k}${v === true || v === 1 || v === '' ? '' : ` (${v})`}</span>`).join('');
                html += `<div style='padding:4px; border-top:1px solid #ddd; font-size:9pt'><b>Qualities:</b> ${qList}</div>`;
                if (atk.Qualities.Blast) html += renderBlastTable(atk, atk.Qualities.Blast);
            }
            html += `</div>`;
        }
    }

    if (itemData.AmmoStats) {
        const aStats = itemData.AmmoStats;
        const d = aStats.Damage || [];
        const dStr = d.length >= 4 ? `${d[0]}d${d[1]}+${d[2]} (${d[3]})` : `<span style='color:#888; font-style:italic'>Non-Standard / Blast Only</span>`;
        html += `
            <div class='sub-header'>Ammunition Profile</div>
            <table class='prop-table'>
                <tr>
                    <td><b>Caliber:</b> ${itemData.Caliber || '-'}</td>
                    ${d.length >= 4 ? `<td><b>Dmg:</b> ${dStr}</td><td><b>Pen:</b> ${aStats.Pen || 0}</td><td><b>Fury:</b> ${aStats.Fury || 0}</td>` : `<td colspan='3'>${dStr}</td>`}
                    <td><b>Recoil:</b> ${aStats.Recoil || 0}</td>
                </tr>
            </table>
        `;
        if (aStats.Qualities && Object.keys(aStats.Qualities).length > 0) {
            let qList = Object.entries(aStats.Qualities).map(([k, v]) => `<span class='tag'>${k}${v === true || v === 1 || v === '' ? '' : ` (${v})`}</span>`).join('');
            html += `<div style='padding:4px; border-bottom:1px solid #ccc; font-size:9pt; background-color:#fff'><b>Qualities:</b> ${qList}</div>`;
            if (aStats.Qualities.Blast) html += renderBlastTable(aStats, aStats.Qualities.Blast);
        }
    }

    let coverage = itemData.ArmourCoverage || (itemData.AttachmentData ? itemData.AttachmentData.ArmourCoverage : null);
    if (coverage && Array.isArray(coverage)) {
        let dMult = Number(itemData.ArmourDegradeMult) || 1;
        html += `<div class='sub-header'>Armour Protection${dMult > 1 ? ` <span style='font-weight:normal; font-size:80%; color:#fbb;'>(Degrade Mult: x${dMult})</span>` : ''}</div>
                 <table class='prop-table'><tr><th>Part</th><th>Sub-Part</th><th>Layer(s)</th><th>Face</th><th>Imp</th><th>Prc</th><th>Rnd</th><th>Exp</th><th>Eng</th><th>Tox</th></tr>`;
        coverage.forEach(entry => {
            let locArr = entry[0] || [], layArr = entry[1] || [], apObj = entry[2] || {};
            html += `<tr><td align='center'>${locArr[0] || ''}</td><td align='center'><b>${locArr[1] || ''}</b></td>
                <td align='center'>${layArr.join(', ')}</td><td align='center' style='font-size:8pt; color:#666'>${entry.length >= 4 ? entry[3] : 'All'}</td>
                <td align='center'>${apObj.I || 0}</td><td align='center'>${apObj.P || 0}</td><td align='center'>${apObj.R || 0}</td>
                <td align='center'>${apObj.X || 0}</td><td align='center'>${apObj.E || 0}</td><td align='center'>${apObj.T || 0}</td></tr>`;
        });
        html += `</table>`;
    }

    if (itemData.AttachmentSlots) {
        html += `<div class='sub-header'>Attachments & Modifications</div><table class='prop-table'><tr><th width='25%'>Slot</th><th width='35%'>Installed Item</th><th width='40%'>Capability</th></tr>`;
        for (const [slotName, _] of Object.entries(itemData.AttachmentSlots)) {
            const attID = (itemData.Attachments || {})[slotName];
            if (attID && attID !== 'null' && attID !== '') {
                const attData = db.items[attID];
                let capability = [];
                if (attData && attData.AttachmentData) {
                    if (attData.AttachmentData.Parasitic) capability.push('Unique Profile');
                    if (attData.AttachmentData.ArmourCoverage) capability.push('Internal Armor');
                    if (attData.AttachmentData.Modifiers) attData.AttachmentData.Modifiers.forEach(m => capability.push(`• ${m.Target.replace('Attacks.*.', '')} ${m.Operation==='Add'?'+':'x'}${m.Value}`));
                }
                if (capability.length === 0) capability.push('Passive Bonus');
                html += `<tr><td><b>${slotName}</b></td><td><span onclick=\"inspectItem('${attID}')\" style='cursor:pointer; color:#000080; font-weight:bold;'>${attData ? attData.Name : 'Unknown'}</span></td><td style='font-size:9pt'>${capability.join('<br>')}</td></tr>`;
            } else html += `<tr><td><b>${slotName}</b></td><td colspan='2' style='color:#888; font-style:italic'>Empty</td></tr>`;
        }
        html += `</table>`;
    }

    if (itemData.Qualities && Object.keys(itemData.Qualities).length > 0) {
        let qList = [];
        for (const [k, v] of Object.entries(itemData.Qualities)) {
            let label = k;
            if (k === 'Shield' && Array.isArray(v)) {
                label = '<b style=color:navy>Shield</b>';
            }
            let suffix = '';
            if (v !== 1 && v !== true && v !== '') {
                suffix = ' (' + v + ')';
            }
            qList.push(label + suffix);
        }
        html += `<div style='margin-top: 15px; padding: 6px; background-color: #eee; border: 1px solid #ccc; text-align: center; font-size: 10pt;'><b>Qualities:</b> ${qList.join(', ')}</div>`;
    }

    if (itemData.Modifiers && Array.isArray(itemData.Modifiers) && itemData.Modifiers.length > 0) {
        html += `<div class='sub-header'>Passive Modifiers</div><div style='padding: 6px; background-color: #fff; border: 1px solid #ccc; font-size: 10pt;'>`;
        itemData.Modifiers.forEach(m => {
            if (m.Type === 'Note') html += `• <b>Note:</b> ${m.Value}<br>`;
            else html += `• ${m.Target} ${(m.Operation === 'Multiply' || m.Operation === 'Mult') ? 'x' : (Number(m.Value) >= 0 && m.Operation !== 'Set' ? '+' : '')}${m.Value}<br>`;
        });
        html += `</div>`;
    }
    col.innerHTML = html;
}

function renderBlastTable(data, radiusArr) {
    if (!Array.isArray(radiusArr)) radiusArr = [radiusArr];
    let html = `<table class='blast-table'><tr><th>Zone</th><th>Radius</th><th>Damage</th><th>Pen</th><th>Fury</th></tr>`;
    for(let i = 0; i < radiusArr.length; i++) {
        let label = radiusArr.length === 1 ? 'Blast' : (radiusArr.length === 2 ? (i===0?'Inner':'Outer') : (i===0?'Inner':(i===1?'Mid':'Outer')));
        let d = (data.BlastDamage || [])[i] || [];
        html += `<tr><td><b>${label}</b></td><td>${radiusArr[i]}m</td><td>${d.length >= 4 ? `${d[0]}d${d[1]}+${d[2]} (${d[3]})` : '-'}</td>
                 <td>${(data.BlastPen || [])[i] || '-'}</td><td>${(data.BlastFury || [])[i] || '-'}+</td></tr>`;
    }
    return html + `</table>`;
}

window.onload = init;

</script>
</body>
</html>
